<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BHM Mark Sheet</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Manjari:wght@400;700&display=swap');
        body { font-family: 'Manjari', sans-serif; background-color: #eef2f3; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .card { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); width: 100%; max-width: 480px; text-align: center; border-top: 8px solid #1a73e8; }
        h2 { color: #1a73e8; margin-bottom: 5px; font-size: 20px; }
        #examTitleDisplay { background: #fff3cd; color: #856404; display: inline-block; padding: 5px 15px; border-radius: 20px; font-size: 13px; font-weight: bold; margin-bottom: 20px; border: 1px solid #ffeeba; }
        .info-box { text-align: left; border: 2px solid #f0f0f0; border-radius: 12px; overflow: hidden; }
        .header { background-color: #f8f9fa; padding: 15px; border-bottom: 2px solid #f0f0f0; }
        table { width: 100%; border-collapse: collapse; }
        td { padding: 10px 15px; border-bottom: 1px solid #eee; font-size: 15px; }
        .val { font-weight: bold; text-align: right; color: #1a73e8; }
        .total { background: #1a73e8; color: white; padding: 15px; font-weight: bold; display: flex; justify-content: space-between; font-size: 18px; }
        .result-status { color: white; padding: 10px; margin-top: 10px; border-radius: 8px; font-weight: bold; text-align: center; }
        .btns { margin-top: 25px; display: flex; gap: 10px; }
        .btn { padding: 10px 20px; border-radius: 8px; text-decoration: none; font-weight: bold; border: none; cursor: pointer; color: white; flex: 1; text-align: center; }
        @media print { .btns { display: none; } }
    </style>
</head>
<body>
<div class="card">
    <h2>BADRUL HUDHA MADRAS PROPPAD</h2>
    <div id="examTitleDisplay">Searching...</div>
    <div id="res"></div>
    <div class="btns">
        <a href="index.html" class="btn" style="background: #6c757d;">Back</a>
      <button onclick="
  var pwin = window.open('', '_blank'); 
  pwin.document.write(document.documentElement.outerHTML); 
  pwin.document.close(); 
  setTimeout(function(){ 
    pwin.focus(); 
    pwin.print(); 
  }, 500);
" class="btn" style="background: #28a745;">Print</button>  
    </div>
</div>
<script>
    const sheetID = '1RHg9qyRnC65YGn4E16Egk_3JTtokCFRJ3cgtIsd2bao';
    const params = new URLSearchParams(window.location.search);
    const roll = params.get('rollNo') ? params.get('rollNo').trim() : "";
    const uClass = params.get('class') ? params.get('class').trim() : "";
    
    // ഷീറ്റ് പേര് ക്ലാസ്സ് നമ്പർ അനുസരിച്ച് മാറുന്നു
    const url = `https://docs.google.com/spreadsheets/d/${sheetID}/gviz/tq?tqx=out:csv&sheet=${uClass}`;

    fetch(url).then(r => r.text()).then(data => {
        const rows = data.split(/\r?\n/).map(r => r.split(',').map(c => c.replace(/^"|"$/g, '')));
        const headers = rows[0];
        document.getElementById('examTitleDisplay').innerText = "അർദ്ധ വാർഷിക മോഡൽ പരീക്ഷ ഫലം 2026-CLASS: 2";

        const s = rows.find(r => r[0] && r[0].trim() === roll);

        if (s) {
            let h = `<div class="info-box"><div class="header"><strong>Name:</strong> ${s[1]}<br><strong>Class:</strong> ${s[2]}</div><table>`;
            let totalVal = "";
            let resStatus = "";

            for (let i = 3; i < headers.length; i++) {
                const head = headers[i] ? headers[i].trim() : "";
                const val = s[i] ? s[i].trim() : "";
                if (head && val !== "" && val !== "-") {
                    if (head.toUpperCase().includes("TOTAL") || head.includes("ആകെ")) totalVal = val;
                    else if (head.toUpperCase().includes("RESULT") || head.includes("ഫലം")) resStatus = val;
                    else h += `<tr><td>${head}</td><td class="val">${val}</td></tr>`;
                }
            }
            h += `</table>`;
            if (totalVal !== "") h += `<div class="total"><span>TOTAL</span><span>${totalVal}</span></div>`;
            if (resStatus !== "") {
                const col = resStatus.toUpperCase() === "PASS" ? "#28a745" : "#dc3545";
                h += `<div class="result-status" style="background:${col}">RESULT: ${resStatus}</div>`;
            }
            h += `</div>`;
            document.getElementById('res').innerHTML = h;
        } else {
            document.getElementById('res').innerHTML = `<p style='color:red;'>റിസൾട്ട് കണ്ടെത്താനായില്ല. നംബർ: ${roll}</p>`;
        }
    }).catch(err => {
        document.getElementById('res').innerHTML = "<p style='color:red;'>ഷീറ്റ് തുറക്കാൻ സാധിക്കുന്നില്ല. ഷീറ്റ് പേര് ക്ലാസ്സ് നമ്പറുമായി (1, 2, 3...) ഒത്തുപോകുണ്ടോ എന്ന് നോക്കുക.</p>";
    });
</script>
</body>
</html>
